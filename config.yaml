Main:
  pickle: .\picklefiles
  run: .\runfiles
  graphimg: .\graph_images
  csv: .\csvfiles
  checkpoint: .\checkpoint
  data: D:\Entity Aspect Linking\data\entity-aspect-linking-2020\collection
  result: .\results
DNN:
  Train:
    epochs: 60
    lr: 0.001
    weight_decay: 1e-4
    train_ratio: 0.8
