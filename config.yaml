  Test:
    batch_size: 128
    disjoint_train_ratio: 0
    negative_sampling_ratio: 5

FinetunedGNN:
  Train:
    epochs: 60
    lr: 2e-5
    weight_decay: 0.0001
    batch_size: 256
    disjoint_train_ratio: 0.999
    negative_sampling_ratio: 1



